[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shildml"
version = "1.9"
description = "SHILD's AI-decision fusion and ML classifier — pure Python, no IRC dependency"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
train = [
    "torch",
]
bot = [
    "limnoria",
    "aiohttp",
    "maxminddb",
]

[tool.setuptools.packages.find]
include = ["shildml*"]

[project.scripts]
shildml-train = "shildml.train:main"
shildml-evaluate = "shildml.evaluate:main"
shildml-replay = "shildml.replay:main"
